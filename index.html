<body class="page home">
  <script>
    // Arriving from the menu / an inner page (X, logo or the browser's Back button):
    // start covered by the white curtain, main.js then slides it down to uncover the video.
    try {
      var nav = performance.getEntriesByType("navigation")[0];
      var backFromInner = nav && nav.type === "back_forward" &&
                          (sessionStorage.getItem("mtc-last-page") || "/") !== "/";
      if (sessionStorage.getItem("mtc-return-home") || backFromInner) {
        document.body.classList.add("is-leaving");
      }
      sessionStorage.removeItem("mtc-return-home");
      sessionStorage.setItem("mtc-last-page", "/");
    } catch (e) {}
  </script>

                       sized for phone / laptop / big screen
  -->

  <!-- White curtain that slides up over the video when MENU is clicked -->
  <div class="curtain" aria-hidden="true"></div>
  <script>
    (function () {
      var v = document.querySelector(".hero");
      // The background video always plays (also when the system asks for reduced motion —
      // it is slow and ambient; page transitions still respect that setting).
      v.addEventListener("playing", function () { v.classList.add("is-playing"); }, { once: true });

      // If the browser blocks autoplay (battery saver, low-power mode, strict settings),
      // start the video on the visitor's first move / click / tap / scroll / key.
      var events = ["pointermove", "pointerdown", "touchstart", "scroll", "keydown", "wheel"];
      function retry() {
        if (!v.paused) return cleanup();
        var q = v.play();
        if (q && q.then) q.then(cleanup).catch(function () {});
      }
      function cleanup() { events.forEach(function (e) { window.removeEventListener(e, retry); }); }
      var p = v.play();
      if (p && p.catch) p.catch(function () {
        events.forEach(function (e) { window.addEventListener(e, retry, { passive: true }); });
      });
      // Coming back to the tab after it was in the background: make sure it is playing
      document.addEventListener("visibilitychange", function () {
        if (!document.hidden && v.paused) v.play().catch(function () {});
      });
    })();
  </script>
